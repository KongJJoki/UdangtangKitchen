<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우당탕 키친</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff3ed;color:#593f43;font:16px system-ui,sans-serif}button,input{font:inherit;border:1px solid #e3b7b4;border-radius:13px;padding:12px}button{background:#d97b7d;color:white;font-weight:800;cursor:pointer}button:hover{background:#be666b}main{max-width:1180px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f6d1ce;border-radius:20px;padding:12px 20px;margin-bottom:14px}h1{margin:0;font-size:30px}h2,h3{margin:8px 0}.panel{background:#fffdfa;border:2px solid #e8c6be;border-radius:20px;padding:18px;box-shadow:0 5px 0 #e9c8bf}#lobby{max-width:470px;margin:60px auto;text-align:center}#lobby input{width:100%;margin:6px 0}#lobby button{margin:5px}#game{display:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:15px}.kitchen{position:relative;aspect-ratio:12/8;border:6px solid #b88d7b;border-radius:18px;overflow:hidden;background-color:#f8e3d8;background-image:linear-gradient(#d9b7aa55 1px,transparent 1px),linear-gradient(90deg,#d9b7aa55 1px,transparent 1px);background-size:8.333333% 12.5%}.tile,.player{position:absolute;width:8.333333%;height:12.5%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(14px,3vw,32px)}.tile{background:#eac3a4;border:2px solid #b68d7e;border-radius:9px;box-shadow:inset 0 -7px #bd9888;line-height:1}.tile[data-t=serve]{background:#f5bbba}.tile[data-t=stove]{background:#a5a5b2}.tile[data-t=counter]{background:#f4dfc7}.tile small{font-size:10px;font-weight:bold;background:#fff8ec;border-radius:4px;padding:2px}.tile .item{position:absolute;right:0;top:0;font-size:20px;background:#fff;border-radius:9px}.player{z-index:3;filter:drop-shadow(0 3px 1px #7f655d55)}.animal{width:78%;height:72%;max-width:52px;border:3px solid #775b58;border-radius:48% 48% 42% 42%;background:#fff7e9;display:grid;place-items:center;position:relative;box-shadow:inset 0 -8px var(--c)}.hat{position:absolute;top:-15px;font-size:20px;color:#fff;text-shadow:0 1px 2px #775b58}.name{font-size:10px;background:var(--c);color:white;border-radius:8px;padding:1px 5px;white-space:nowrap}.held{position:absolute;right:-1px;bottom:3px;font-size:19px;background:#fff;border-radius:9px;z-index:2}.face{position:absolute;color:#694946;font-size:13px}.ticket{padding:12px;background:#fff5e9;border:1px solid #ebc5b5;border-radius:12px;margin:10px 0}.bar{height:7px;background:#ead3ca;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#85bc79}.hint{font-size:14px;color:#876d68;margin-top:15px}#players{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}#players span{background:white;padding:7px 12px;border-radius:13px;border-bottom:3px solid var(--c)}#overlay{position:absolute;inset:0;background:#fff6e8d9;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}#msg{color:#af5353;min-height:24px} @media(max-width:700px){.layout{grid-template-columns:1fr}header{flex-wrap:wrap}main{padding:8px}.tile small{font-size:8px}}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stat{background:#fffdfa;border:1px solid #e5b5ab;border-radius:14px;padding:7px 14px;min-width:92px;text-align:center;line-height:1.1}.stat label{display:block;font-size:12px;font-weight:700;color:#80615c;margin-bottom:4px}.stat strong{font-size:23px;font-variant-numeric:tabular-nums}.stat.score{background:#fff5ce;border:2px solid #e6b957;min-width:142px}.stat.score strong{font-size:34px;color:#835119}.stat.score.pop{animation:scorepop .35s ease-out}@keyframes scorepop{50%{transform:scale(1.08);background:#dff3ce}}.ticket-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.reward{display:inline-block;white-space:nowrap;background:#e3f1db;border:1px solid #bad4ae;border-radius:8px;padding:4px 6px;color:#37652e;font-size:13px;font-weight:800}.ticket .hint{margin-top:8px}.score-note{font-size:12px;color:#80615c;margin-top:10px}.gain{font-size:13px;color:#37652e;font-weight:800;min-height:16px}.gain.loss{color:#a94d4d}.stage-controls{margin:0 0 12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#fffdfa;border:1px solid #e8c6be;border-radius:16px;padding:12px}.stage-controls button{padding:8px 12px;background:#f5e1d8;color:#694946;font-size:14px}.stage-controls button.selected{background:#a85d62;color:#fff;border-color:#a85d62}.stage-controls button:disabled{cursor:default;opacity:.75}.stage-title{font-weight:800;font-size:17px;margin:0 0 8px}.stage-help{font-size:13px;color:#805e56;line-height:1.6;background:#fff7e9;padding:9px;border-radius:10px;margin:8px 0}.tile[data-t=ricepot]{background:#d9d4eb}.tile[data-t=hotpot]{background:#eeb0a2}.tile[data-t=grill]{background:#c1b4ac}.tile .item{max-width:100%;font-size:15px;line-height:1.15;text-align:center;padding:2px;overflow-wrap:anywhere}.held{max-width:120%;font-size:15px;line-height:1.1;overflow-wrap:anywhere}.tile[data-busy=true]{box-shadow:inset 0 -7px #e2a654}.tile .cookbar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#fff}.tile .cookbar i{display:block;height:4px;background:#76a86d}.kitchen[data-stage=rice]{background-color:#f8e7cb}.kitchen[data-stage=sushi]{background-color:#e8ede3}.kitchen[data-stage=mala]{background-color:#f8d9cf}.kitchen[data-stage=skewer]{background-color:#f1e2cc}.stage-controls .mode-caption{width:100%;font-size:12px;color:#80615c}</style><main><header><h1>🍳 우당탕 키친 <small style='font-size:12px'>v0.2.0</small></h1><div id="hud">친구들과 함께 요리해요!</div></header><section id="lobby" class="panel"><h2>어서 오세요, 셰프님!</h2><p>최대 6명이 함께하는 협동 요리 게임</p><input id="nick" maxlength="12" placeholder="닉네임"><button id="create">새 방 만들기</button><hr><input id="code" maxlength="5" placeholder="친구의 방 코드"><button id="join">방 입장</button><p id="msg"></p></section><section id="game"><div id="stageControls" class="stage-controls"></div><div id="stageTitle" class="stage-title"></div><div class="layout"><div><div class="kitchen" id="board"></div><div id="players"></div><div class="hint">WASD / 방향키 이동 · E 집기 / 놓기 / 조리 / 서빙 · 조리대 앞을 바라보고 E를 누르세요.</div></div><aside class="panel"><h2>🔔 주문</h2><div id="orders"></div><p class="score-note">주문 완료 시 팀 점수 획득 · 시간 초과 시 최대 20점 차감</p><p id="stageHelp" class="stage-help"></p><button id="copy">방 코드 복사</button> <button id="exit">나가기</button></aside></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io(),animals=['🐶','🐧','🐰','🐱','🐻','🐹'];let state=null;const names={tomato:'토마토',lettuce:'양상추',meat:'고기',bread:'빵',plate:'접시',chop:'손질',stove:'가열',counter:'조립',trash:'쓰레기',serve:'서빙'};const icons={tomato:'🍅',lettuce:'🥬',meat:'🥩',bread:'🍞',plate:'🍽️',chop:'🔪',stove:'🍳',counter:'🟫',trash:'🗑️',serve:'🔔','chopped tomato':'🍅','chopped lettuce':'🥬','cooked meat':'🥩'};Object.assign(names,{rice:'쌀',carrot:'당근',egg:'달걀',salmon:'연어',tuna:'참치',seaweed:'김',mushroom:'버섯',cabbage:'배추',tofu:'두부',pepper:'파프리카',stick:'꼬치 막대',ricepot:'밥솥',hotpot:'큰 냄비',grill:'회전 그릴'});Object.assign(icons,{rice:'🌾',carrot:'🥕',egg:'🥚',salmon:'🐟',tuna:'🐟',seaweed:'◼️',mushroom:'🍄',cabbage:'🥬',tofu:'◻️',pepper:'🫑',stick:'🍢',ricepot:'🍚',hotpot:'🍲',grill:'🔥','cooked rice':'🍚','cooked egg':'🍳','chopped carrot':'🥕','chopped salmon':'🐟','chopped tuna':'🐟','chopped meat':'🥩','chopped mushroom':'🍄','chopped cabbage':'🥬','chopped tofu':'◻️','chopped pepper':'🫑'});const ingredientName=k=>k.startsWith('chopped ')?'손질 '+(names[k.slice(8)]||k):k.startsWith('cooked ')?(k==='cooked rice'?'밥':'익힌 '+(names[k.slice(7)]||k)):names[k]||k;const themes={random:['🎲 랜덤 순환','매 판 다른 주방 · 점수 누적'],burger:['🍔 버거 & 샌드위치','채소 손질 → 고기 굽기 → 접시에 조립'],rice:['🍚 밥집','쌀을 밥솥에 넣어 5초 조리 → 고기·달걀·당근과 조립'],sushi:['🍣 초밥집','쌀을 밥솥에 넣기 → 연어·참치 손질 → 접시에 조립'],mala:['🍲 마라탕','재료 손질 → 큰 냄비에 2~3개 넣기 → 빈손 E로 5초 끓이기 → 빈 접시를 들고 E로 담기'],skewer:['🍢 꼬치','꼬치 막대를 조립대에 놓고 손질 재료 끼우기 → 그릴에 놓기 → 빈손 E로 1초 간격 3번 돌리기 → 빈 접시로 담기']};function stageUI(r){$('board').dataset.stage=r.stage;$('stageTitle').textContent=(themes[r.stage]?.[0]||'주방')+(r.stageNo?' · 스테이지 '+r.stageNo+' · 이번 판 '+r.stageScore+'점':'');$('stageHelp').textContent=themes[r.stage]?.[1]||'';const locked=r.phase==='playing'||r.phase==='break'||r.host!==socket.id;const key=r.mode+'|'+locked+'|'+r.phase;if($('stageControls').dataset.key===key)return;$('stageControls').dataset.key=key;$('stageControls').innerHTML='<strong>음식 테마</strong>'+Object.entries(themes).map(([k,v])=>'<button data-mode="'+k+'" class="'+(r.mode===k?'selected':'')+'" '+(locked?'disabled':'')+'>'+v[0]+'</button>').join('')+'<span class="mode-caption">'+(r.mode==='random'?'3분마다 다른 주방으로 이동 · 8초 휴식 · 팀 점수 누적':'선택한 주방에서 3분간 요리')+(r.host!==socket.id?' · 방장만 변경 가능':'')+'</span>';$('stageControls').querySelectorAll('button').forEach(b=>b.onclick=()=>socket.emit('mode',b.dataset.mode))};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function enter(event){if(!socket.connected){$('msg').textContent='서버 연결 중입니다.';return}socket.timeout(5000).emit(event,{name:$('nick').value,code:$('code').value},(err,r)=>{if(err||r.error){$('msg').textContent=err?'응답이 없어요. 다시 시도해 주세요.':r.error;return}$('lobby').style.display='none';$('game').style.display='block'})}$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('exit').onclick=()=>{socket.emit('leave');state=null;$('stageControls').dataset.key='';$('game').style.display='none';$('lobby').style.display='block';$('hud').textContent='친구들과 함께 요리해요!'};$('copy').onclick=async()=>{if(state){try{await navigator.clipboard.writeText(state.code);$('copy').textContent='복사 완료!'}catch{prompt('방 코드',state.code)}}};function item(i){if(!i)return '';const prefix={'plate':'🍽️','stick':'🍢','mala raw':'🍲','mala cooked':'🍲✓','skewer raw':'🍢','skewer cooked':'🍢✓'}[i.type];return prefix?prefix+(i.items||[]).map(x=>icons[x]||'❔').join('')+(i.type==='skewer raw'?' '+i.turns+'/3':''):icons[i.type]||'❔'}function pos(x,y){return 'left:'+x/12*100+'%;top:'+y/8*100+'%'};let gainTimer;socket.on('state',r=>{const prev=state;state=r;stageUI(r);let time=Math.max(0,Math.ceil((r.end-Date.now())/1000));if(!$('teamScore')){$('hud').innerHTML='<div class="stat"><label>방 코드</label><strong id="roomLabel"></strong></div><div class="stat"><label>남은 시간</label><strong id="timeLabel"></strong></div><div class="stat score" id="scoreBox"><label>⭐ 팀 점수</label><strong id="teamScore">0</strong><div class="gain" id="scoreGain"></div></div>'}$('roomLabel').textContent=r.code;$('timeLabel').textContent=r.phase==='lobby'?'3:00':Math.floor(time/60)+':'+String(time%60).padStart(2,'0');$('teamScore').textContent=r.score.toLocaleString('ko-KR')+'점';if(prev&&prev.code===r.code&&prev.phase==='playing'&&r.phase==='playing'&&prev.score!==r.score){const diff=r.score-prev.score;$('scoreGain').textContent=(diff>0?'+':'')+diff+'점';$('scoreGain').className='gain'+(diff<0?' loss':'');$('scoreBox').classList.remove('pop');void $('scoreBox').offsetWidth;$('scoreBox').classList.add('pop');clearTimeout(gainTimer);gainTimer=setTimeout(()=>{if($('scoreGain'))$('scoreGain').textContent=''},1800)}$('board').innerHTML=r.stations.map(t=>'<div class="tile" data-t="'+t.t+'" style="'+pos(t.x,t.y)+'">'+icons[t.t]+'<small>'+names[t.t]+'</small>'+(t.item?'<span class="item">'+(t.ready>Date.now()?'⏳ '+item(t.item):item(t.item))+'</span>':'')+'</div>').join('')+Object.entries(r.players).map(([k,p])=>'<div class="player" style="'+pos(p.x,p.y)+';--c:'+p.color+'"><span class="name">'+(k===socket.id?'★ ':'')+escapeHTML(p.name)+'</span><div class="animal"><span class="hat">☁</span>'+animals[p.avatar%6]+'</div><span class="face" style="left:'+(50+p.face[0]*40)+'%;top:'+(50+p.face[1]*40)+'%">•</span>'+(p.held?'<span class="held">'+item(p.held)+'</span>':'')+'</div>').join('');$('players').innerHTML=Object.values(r.players).map(p=>'<span style="--c:'+p.color+'">'+animals[p.avatar%6]+' '+escapeHTML(p.name)+'</span>').join('');$('orders').innerHTML=r.orders.map(o=>'<div class="ticket"><div class="ticket-head"><b>'+o.icon+' '+o.name+'</b><span class="reward">+'+(o.points??100)+'점</span></div><div class="hint">'+o.items.map(k=>(icons[k]||'')+' '+ingredientName(k)).join(' + ')+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,(o.until-Date.now())/(o.duration/100)))+'%"></i></div></div>').join('');if(r.phase!=='playing'){$('board').insertAdjacentHTML('beforeend','<div id="overlay"><h2>'+(r.phase==='break'?'스테이지 완료! '+r.stageScore+'점':r.phase==='done'?'요리 끝! '+r.score+'점':'친구를 기다리는 중')+'</h2><p>방 코드: <b>'+r.code+'</b> · '+Object.keys(r.players).length+'/6명</p>'+(r.phase==='break'?'<p>다음 주방까지 '+time+'초</p>'+(r.host===socket.id?'<button id="stop">여기서 종료</button>':''):r.host===socket.id?'<button id="start">요리 시작!</button>':'<p>방장이 시작하면 게임이 시작돼요.</p>')+'</div>');if($('start'))$('start').onclick=()=>socket.emit('start');if($('stop'))$('stop').onclick=()=>socket.emit('stop')}});socket.on('disconnect',()=>{state=null;down=[];$('game').style.display='none';$('lobby').style.display='block';$('msg').textContent='연결이 끊겼어요. 다시 입장해 주세요.'});const keys={KeyW:[0,-1],KeyA:[-1,0],KeyS:[0,1],KeyD:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};let down=[],nextMove=0;function step(code){if(socket.connected&&state?.phase==='playing'){socket.emit('move',keys[code])}}function clearMovement(){down=[];nextMove=0}window.addEventListener('keydown',e=>{if(!socket.connected||state?.phase!=='playing')return;if(keys[e.code]){e.preventDefault();if(!down.includes(e.code)){down.push(e.code);step(e.code);nextMove=performance.now()+260}return}if(e.code==='KeyE'&&!e.repeat){e.preventDefault();socket.emit('act')}},true);window.addEventListener('keyup',e=>{if(!keys[e.code])return;down=down.filter(k=>k!==e.code);if(!down.length)nextMove=0},true);window.addEventListener('blur',clearMovement);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMovement()});setInterval(()=>{if(!socket.connected||state?.phase!=='playing'){clearMovement();return}if(down.length&&performance.now()>=nextMove){step(down[down.length-1]);nextMove=performance.now()+140}},20);
</script></html>
