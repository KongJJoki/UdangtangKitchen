<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우당탕 키친</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff3ed;color:#593f43;font:16px system-ui,sans-serif}button,input{font:inherit;border:1px solid #e3b7b4;border-radius:13px;padding:12px}button{background:#d97b7d;color:white;font-weight:800;cursor:pointer}button:hover{background:#be666b}main{max-width:1180px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f6d1ce;border-radius:20px;padding:12px 20px;margin-bottom:14px}h1{margin:0;font-size:30px}h2,h3{margin:8px 0}.panel{background:#fffdfa;border:2px solid #e8c6be;border-radius:20px;padding:18px;box-shadow:0 5px 0 #e9c8bf}#lobby{max-width:470px;margin:60px auto;text-align:center}#lobby input{width:100%;margin:6px 0}#lobby button{margin:5px}#game{display:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:15px}.kitchen{position:relative;aspect-ratio:12/8;border:6px solid #b88d7b;border-radius:18px;overflow:hidden;background-color:#f8e3d8;background-image:linear-gradient(#d9b7aa55 1px,transparent 1px),linear-gradient(90deg,#d9b7aa55 1px,transparent 1px);background-size:8.333333% 12.5%}.tile,.player{position:absolute;width:8.333333%;height:12.5%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(14px,3vw,32px)}.tile{background:#eac3a4;border:2px solid #b68d7e;border-radius:9px;box-shadow:inset 0 -7px #bd9888;line-height:1}.tile[data-t=serve]{background:#f5bbba}.tile[data-t=stove]{background:#a5a5b2}.tile[data-t=counter]{background:#f4dfc7}.tile small{font-size:10px;font-weight:bold;background:#fff8ec;border-radius:4px;padding:2px}.tile .item{position:absolute;right:0;top:0;font-size:20px;background:#fff;border-radius:9px}.player{z-index:3;filter:drop-shadow(0 3px 1px #7f655d55)}.animal{width:78%;height:72%;max-width:52px;border:3px solid #775b58;border-radius:48% 48% 42% 42%;background:#fff7e9;display:grid;place-items:center;position:relative;box-shadow:inset 0 -8px var(--c)}.hat{position:absolute;top:-15px;font-size:20px;color:#fff;text-shadow:0 1px 2px #775b58}.name{font-size:10px;background:var(--c);color:white;border-radius:8px;padding:1px 5px;white-space:nowrap}.held{position:absolute;right:-1px;bottom:3px;font-size:19px;background:#fff;border-radius:9px;z-index:2}.face{position:absolute;color:#694946;font-size:13px}.ticket{padding:12px;background:#fff5e9;border:1px solid #ebc5b5;border-radius:12px;margin:10px 0}.bar{height:7px;background:#ead3ca;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#85bc79}.hint{font-size:14px;color:#876d68;margin-top:15px}#players{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}#players span{background:white;padding:7px 12px;border-radius:13px;border-bottom:3px solid var(--c)}#overlay{position:absolute;inset:0;background:#fff6e8d9;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}#msg{color:#af5353;min-height:24px} @media(max-width:700px){.layout{grid-template-columns:1fr}header{flex-wrap:wrap}main{padding:8px}.tile small{font-size:8px}}
</style><main><header><h1>🍳 우당탕 키친</h1><div id="hud">친구들과 함께 요리해요!</div></header><section id="lobby" class="panel"><h2>어서 오세요, 셰프님!</h2><p>최대 6명이 함께하는 협동 요리 게임</p><input id="nick" maxlength="12" placeholder="닉네임"><button id="create">새 방 만들기</button><hr><input id="code" maxlength="5" placeholder="친구의 방 코드"><button id="join">방 입장</button><p id="msg"></p></section><section id="game"><div class="layout"><div><div class="kitchen" id="board"></div><div id="players"></div><div class="hint">WASD / 방향키 이동 · E 집기 / 놓기 / 조리 / 서빙 · 조리대 앞을 바라보고 E를 누르세요.</div></div><aside class="panel"><h2>🔔 주문</h2><div id="orders"></div><p class="hint">접시를 들고 손질된 재료를 하나씩 담은 뒤 서빙대에 제출하세요.</p><button id="copy">방 코드 복사</button> <button id="exit">나가기</button></aside></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io(),animals=['🐶','🐧','🐰','🐱','🐻','🐹'];let state=null;const names={tomato:'토마토',lettuce:'양상추',meat:'고기',bread:'빵',plate:'접시',chop:'손질',stove:'가열',counter:'조립',trash:'쓰레기',serve:'서빙'};const icons={tomato:'🍅',lettuce:'🥬',meat:'🥩',bread:'🍞',plate:'🍽️',chop:'🔪',stove:'🍳',counter:'🟫',trash:'🗑️',serve:'🔔','chopped tomato':'🍅','chopped lettuce':'🥬','cooked meat':'🥩'};const recipes=[['🥗 토마토 샐러드','🍅 손질 토마토 + 🥬 손질 양상추'],['🍖 스테이크','🥩 익힌 고기'],['🍔 버거','🍞 빵 + 🥩 익힌 고기 + 🥬 손질 양상추']];const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function enter(event){if(!socket.connected){$('msg').textContent='서버 연결 중입니다.';return}socket.timeout(5000).emit(event,{name:$('nick').value,code:$('code').value},(err,r)=>{if(err||r.error){$('msg').textContent=err?'응답이 없어요. 다시 시도해 주세요.':r.error;return}$('lobby').style.display='none';$('game').style.display='block'})}$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('exit').onclick=()=>{socket.emit('leave');state=null;$('game').style.display='none';$('lobby').style.display='block';$('hud').textContent='친구들과 함께 요리해요!'};$('copy').onclick=async()=>{if(state){try{await navigator.clipboard.writeText(state.code);$('copy').textContent='복사 완료!'}catch{prompt('방 코드',state.code)}}};function item(i){return i?i.type==='plate'?'🍽️'+i.items.map(x=>icons[x]).join(''):icons[i.type]||'❔':''}function pos(x,y){return 'left:'+x/12*100+'%;top:'+y/8*100+'%'};socket.on('state',r=>{state=r;let time=Math.max(0,Math.ceil((r.end-Date.now())/1000));$('hud').textContent='방 '+r.code+' · ⏱ '+Math.floor(time/60)+':'+String(time%60).padStart(2,'0')+' · ⭐ '+r.score+'점';$('board').innerHTML=r.stations.map(t=>'<div class="tile" data-t="'+t.t+'" style="'+pos(t.x,t.y)+'">'+icons[t.t]+'<small>'+names[t.t]+'</small>'+(t.item?'<span class="item">'+(t.ready>Date.now()?'⏳':item(t.item))+'</span>':'')+'</div>').join('')+Object.entries(r.players).map(([k,p])=>'<div class="player" style="'+pos(p.x,p.y)+';--c:'+p.color+'"><span class="name">'+(k===socket.id?'★ ':'')+escapeHTML(p.name)+'</span><div class="animal"><span class="hat">☁</span>'+animals[p.avatar%6]+'</div><span class="face" style="left:'+(50+p.face[0]*40)+'%;top:'+(50+p.face[1]*40)+'%">•</span>'+(p.held?'<span class="held">'+item(p.held)+'</span>':'')+'</div>').join('');$('players').innerHTML=Object.values(r.players).map(p=>'<span style="--c:'+p.color+'">'+animals[p.avatar%6]+' '+escapeHTML(p.name)+'</span>').join('');$('orders').innerHTML=r.orders.map(o=>'<div class="ticket"><b>'+recipes[o.r][0]+'</b><div class="hint">'+recipes[o.r][1]+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,(o.until-Date.now())/650))+'%"></i></div></div>').join('');if(r.phase!=='playing'){$('board').insertAdjacentHTML('beforeend','<div id="overlay"><h2>'+(r.phase==='done'?'요리 끝! '+r.score+'점':'친구를 기다리는 중')+'</h2><p>방 코드: <b>'+r.code+'</b> · '+Object.keys(r.players).length+'/6명</p>'+(r.host===socket.id?'<button id="start">요리 시작!</button>':'<p>방장이 시작하면 게임이 시작돼요.</p>')+'</div>');if($('start'))$('start').onclick=()=>socket.emit('start')}});socket.on('disconnect',()=>{state=null;down=[];$('game').style.display='none';$('lobby').style.display='block';$('msg').textContent='연결이 끊겼어요. 다시 입장해 주세요.'});const keys={w:[0,-1],a:[-1,0],s:[0,1],d:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};let down=[];document.addEventListener('keydown',e=>{if(!state||state.phase!=='playing'||e.target.tagName==='INPUT')return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(keys[k]){e.preventDefault();if(!e.repeat&&!down.includes(k)){down.push(k);socket.emit('move',keys[k])}}if(k==='e'&&!e.repeat)socket.emit('act')});document.addEventListener('keyup',e=>{down=down.filter(k=>k!==(e.key.length===1?e.key.toLowerCase():e.key))});window.addEventListener('blur',()=>down=[]);
</script></html>
