/* Cooking illustrations frame both screens without intercepting play. */
body {
  background: radial-gradient(ellipse at 50% 12%, #fff9df, transparent 63%),
              linear-gradient(145deg, #fff1bc, #ffe7a4);
}
.scene-decor {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}
body { isolation: isolate; min-height: 100vh; }
.scene-decor img {
  position: absolute;
  width: clamp(66px, 14vw, 190px);
  height: clamp(66px, 14vw, 190px);
  object-fit: contain;
  filter: drop-shadow(0 7px 3px #a8643233);
}
.scene-decor .stove { left: 6%; top: max(345px, 39vh); rotate: -15deg; }
.scene-decor .lettuce { right: 9%; top: max(345px, 39vh); rotate: 16deg; width: clamp(52px, 9vw, 130px); }
.scene-decor .chop { right: 4%; top: 40%; rotate: 18deg; }
.scene-decor .tomato { left: 11%; top: 44%; rotate: -14deg; width: clamp(58px, 8vw, 112px); }
.scene-decor .hotpot { left: 5%; bottom: 5%; rotate: -12deg; }
.scene-decor .egg { right: 12%; bottom: 6%; rotate: 15deg; width: clamp(58px, 9vw, 125px); }

body:has(#lobby:not([style*="display: none"])) {
  background: #fff0bc;
}
main:has(#lobby:not([style*="display: none"])) {
  position: relative;
  max-width: none;
  padding: 0;
  overflow: hidden;
}
main:has(#lobby:not([style*="display: none"])) > :is(header, footer),

#lobby {
  /* Keep the reference artwork proportional and center its form on narrow screens. */
  position: relative;
  left: 50%;
  width: max(452px, 100%);
  max-width: none;
  aspect-ratio: 1278 / 1231;
  transform: translateX(-50%);
  margin: 0;
  padding: 0;
  border: 0;
  box-shadow: none;
  background: url("/lobby-reference.png") center / 100% 100% no-repeat;
  container-type: inline-size;
}
#lobbyLogo {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.lobby-controls {
  /* Cover the reference's drawn controls with the working form. */
  position: absolute;
  inset: 40.8% 17.5% 24.2% 17.1%;
  padding: 1cqw .15cqw 0;
  background: radial-gradient(ellipse at 52% 48%, #fbf7eb, #fbf6e8);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(3px, .7cqw, 8px);
}
#lobby input {
  flex: none;
  height: clamp(34px, 6.6cqw, 73px);
  margin: 0;
  padding: 0 1.8cqw;
  border-radius: clamp(11px, 2cqw, 24px);
  color: #593c27;
  font-size: clamp(14px, 2.45cqw, 27px);
  background: #fcfaf2;
}
#lobby hr { width: 100%; margin: .3cqw 0; }
#lobby #msg {
  width: 100%;
  margin: 3px 0 0;
  color: #713918;
  font-size: clamp(12px, 1.55cqw, 17px);
}
#lobby #msg:empty { display: none; }
#lobby .bread-button {
  --bread-row: 0%;
  --toast-width: clamp(84px, 15cqw, 156px);
  display: grid;
  place-items: center;
  flex: none;
  width: clamp(132px, 18.5cqw, 212px);
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  transition: transform .12s ease;
}
#lobby .bread-button::before {
  content: "";
  width: var(--toast-width);
  aspect-ratio: 3 / 2;
  background: url("/lobby-toast-buttons.png") 0% var(--bread-row) / 200% 200% no-repeat;
  filter: drop-shadow(0 2px 0 #8851264d);
}
#lobby #join { --bread-row: 100%; }
#lobby .bread-button:is(:hover, :focus-visible)::before { background-position-x: 100%; }
#lobby .bread-button:focus-visible { outline: 2px solid #60371e; outline-offset: 2px; }
#lobby .bread-button:active { transform: translateY(2px) scale(.98); }
@media (max-width: 460px) {
  #lobby { margin-top: max(0px, calc((100svh - 510px) / 2)); }
}
@container (max-width: 560px) {
  .lobby-controls { top: 39.4%; padding-top: 1px; gap: 2px; }

@media (min-width: 800px) and (min-height: 440px) and (min-aspect-ratio: 6/5) {
  #lobby {
    --art-height: max(100svh, calc(100vw * 941 / 1672));
    left: 0;
    width: 100%;
    height: 100svh;
    aspect-ratio: auto;
    transform: none;
    background-image: url("/lobby-wide.png");
    background-size: cover;
  }
  .lobby-controls {
    /* Anchor the form to the blank panel in the uniformly scaled artwork. */
    inset: calc(50% - var(--art-height) * .075) auto auto 50%;
    width: min(46%, 85svh, 800px);
    transform: translateX(-50%);
    gap: clamp(3px, .85svh, 8px);
    padding: 0;
    background: none;
  }
  #lobby input {
    height: clamp(32px, 6.5svh, 68px);
    padding-inline: clamp(12px, 2svh, 22px);
    border-radius: clamp(11px, 2svh, 24px);
    font-size: clamp(14px, 2.4svh, 25px);
  }
  #lobby hr { margin: .4svh 0; }
  #lobby .bread-button {
    --toast-width: clamp(74px, 14.8svh, 156px);
    width: clamp(132px, 18.5svh, 212px);
  }
}
@media (max-width: 700px) {
  .scene-decor img { opacity: .45; }
  .scene-decor .stove, .scene-decor .hotpot { left: -25px; }
  .scene-decor .chop { right: -26px; }
  .scene-decor .tomato { left: -20px; }
  .scene-decor .lettuce, .scene-decor .egg { right: -17px; }
}
@media (prefers-reduced-motion: reduce) {
  #lobby .bread-button { transition: none; }
}

s="ingredient-chip">'+food(k)+ingredientName(k)+'</span>').join('')+'</div></div></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,(o.until-Date.now())/(o.duration/100)))+'%"></i></div></div>').join('');if(r.phase!=='playing'){$('board').insertAdjacentHTML('beforeend','<div id="overlay"><h2>'+(r.phase==='break'?'스테이지 완료! '+r.stageScore+'점':r.phase==='done'?'요리 끝! '+r.score+'점':'친구를 기다리는 중')+'</h2><p>방 코드: <b>'+r.code+'</b> · '+Object.keys(r.players).length+'/6명</p>'+(r.phase==='break'?'<p>다음 주방까지 '+time+'초</p>'+(r.host===socket.id?'<button id="stop">여기서 종료</button>':''):r.host===socket.id?'<button id="start">요리 시작!</button>':'<p>방장이 시작하면 게임이 시작돼요.</p>')+'</div>');if($('start'))$('start').onclick=()=>socket.emit('start');if($('stop'))$('stop').onclick=()=>socket.emit('stop')}});socket.on('disconnect',()=>{state=null;down=[];$('game').style.display='none';$('lobby').style.display='block';$('msg').textContent='연결이 끊겼어요. 다시 입장해 주세요.'});const keys={KeyW:[0,-1],KeyA:[-1,0],KeyS:[0,1],KeyD:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};let down=[],lastSent='';function sendMovement(force=false){if(!socket.connected||state?.phase!=='playing')return;let x=0,y=0;for(const k of down){x+=keys[k][0];y+=keys[k][1]}const v=[Math.sign(x),Math.sign(y)],sig=v.join(',');if(force||sig!==lastSent||v.some(Boolean)){socket.emit('move',v);lastSent=sig}}function clearMovement(){down=[];sendMovement(true);lastSent=''}window.addEventListener('keydown',e=>{if(!socket.connected||!state)return;if(e.isComposing||e.keyCode===229)return;if(e.code==='Enter'&&document.activeElement!==$('chatInput')&&!e.repeat){e.preventDefault();clearMovement();$('chatInput').focus();return}if(document.activeElement===$('chatInput')||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(state.phase!=='playing')return;if(keys[e.code]){e.preventDefault();if(!down.includes(e.code)){down.push(e.code);sendMovement(true)}return}if(e.code==='KeyE'&&!e.repeat){e.preventDefault();socket.emit('act',state.players[socket.id]?.target||null)}},true);window.addEventListener('keyup',e=>{if(!keys[e.code])return;down=down.filter(k=>k!==e.code);sendMovement(true)},true);window.addEventListener('blur',clearMovement);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMovement()});setInterval(()=>{if(!socket.connected||state?.phase!=='playing'||document.activeElement===$('chatInput')){down=[];lastSent='';return}sendMovement()},80);
function renderChat(r){const log=$('chatLog');const messages=r.chat||[];const key=r.code+'|'+JSON.stringify(messages);if(log.dataset.key===key)return;const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<35;log.dataset.key=key;log.innerHTML=messages.length?messages.map(m=>'<div class="chat-line"><b style="color:'+m.color+'">'+escapeHTML(m.name)+'</b><span>'+escapeHTML(m.message)+'</span></div>').join(''):'<div class="chat-empty">친구들과 대화해 보세요!</div>';if(atBottom)log.scrollTop=log.scrollHeight}
$('chatInput').addEventListener('focus',clearMovement);$('chatInput').addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Escape'){e.preventDefault();$('chatInput').blur()}else if(e.key==='Enter'){e.preventDefault();submitChat()}});
function submitChat(){const input=$('chatInput'),msg=input.value.trim();if(state&&socket.connected&&msg)socket.emit('chat',msg);input.value='';input.blur();clearMovement();$('board').focus({preventScroll:true})}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();submitChat()});$('board').tabIndex=-1;
function pingAt(e,kind){if(!state||state.phase!=='playing'||document.activeElement===$('chatInput'))return;const field=$('board').querySelector('.playfield');if(!field)return;const rect=field.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*12,y=(e.clientY-rect.top)/rect.height*8;if(x>=0&&x<=12&&y>=0&&y<=8)socket.emit('ping',{kind,x,y})}

function renderPings(field,r){let layer=field.querySelector('.ping-layer');if(!layer){layer=document.createElement('div');layer.className='ping-layer';field.appendChild(layer)}const existing=new Map([...layer.children].map(el=>[el.dataset.pingId,el]));for(const p of (r.phase==='playing'?r.pings||[]:[])){if(p.until<=Date.now())continue;const id=p.id||p.name+'-'+p.until;if(existing.has(id)){existing.delete(id);continue}const el=document.createElement('div');el.className='map-ping '+(p.kind==='!'?'alert-ping':'question-ping');el.dataset.pingId=id;el.style.left=p.x/12*100+'%';el.style.top=p.y/8*100+'%';const symbol=document.createElement('b');symbol.textContent=p.kind;const label=document.createElement('small');label.textContent=p.name;el.append(symbol,label);layer.appendChild(el)}existing.forEach(el=>el.remove())}
function cookingStatus(t){if(t.burned||t.item?.type==='burnt')return '<span class="cooking-status burnt-status">탄 음식!</span>';if(t.ready)return '<span class="cook-progress" data-start="'+t.started+'" data-end="'+t.ready+'"><i></i></span>';if(t.burnAt)return '<span class="cooking-status ready-status">✓ 완료</span><span class="cook-progress burn-progress" data-start="'+t.burnStarted+'" data-end="'+t.burnAt+'"><i></i></span>';if(t.completed)return '<span class="cooking-status ready-status">✓ 완료</span>';return ''}
function updateCookingBars(){const now=Date.now();document.querySelectorAll('.cook-progress').forEach(el=>{const start=Number(el.dataset.start),end=Number(el.dataset.end);el.firstElementChild.style.width=Math.max(0,Math.min(100,(now-start)/Math.max(1,end-start)*100))+'%'})}setInterval(updateCookingBars,60);
